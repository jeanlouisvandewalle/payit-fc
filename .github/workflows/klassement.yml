# Haalt elke dag het klassement op van mvbi.be en werkt js/klassement.js bij.
# Handmatig starten kan ook: tabblad "Actions" op GitHub → "Klassement bijwerken" → "Run workflow".
name: Klassement bijwerken

on:
  schedule:
    - cron: "0 6,22 * * *"   # elke dag om 06:00 en 22:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-bijwerken
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-klassement.mjs
      - name: Wijzigingen opslaan
        run: |
          if git diff --quiet -- js/klassement.js; then
            echo "Geen wijzigingen."
            exit 0
          fi
          # alleen committen als er echt iets anders is dan de datum
          if [ "$(git diff -U0 -- js/klassement.js | grep '^[+-] ' | grep -vc bijgewerkt)" = "0" ]; then
            git checkout -- js/klassement.js
            echo "Enkel de datum veranderde."
            exit 0
          fi
          # de vooraf gegenereerde pagina's bevatten het klassement: mee vernieuwen
          node scripts/build.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898702+github-actions[bot]@users.noreply.github.com"
          git add -A -- js/klassement.js '*.html' sitemap.xml
          git commit -m "Klassement bijgewerkt van MVBI"
          git pull --rebase
          git push
